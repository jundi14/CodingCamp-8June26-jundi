<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Expense &amp; Budget Visualizer</h1>

    <form id="expense-form">
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" maxlength="100" required>

        <label for="amount">Amount</label>
        <input type="number" id="amount" min="0.01" max="9999999.99" step="0.01" required>

        <label for="category">Category</label>
        <select id="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
        </select>

        <p id="form-error" class="error hidden"></p>
        <button type="submit">Add Transaction</button>
    </form>

    <p id="storage-error" class="error hidden"></p>

    <section class="balance-section">
      <h2>Total Balance:<span id="balance">0.00</span></h2>
    </section>

    <section class="transactions-section">
      <h2>Transactions</h2>
      <ul id="transaction-list">
        <li class="empty-state">No transactions added yet.</li>
      </ul>
    </section>

    <section id="chart-container">
      <h2>Spending by Category</h2>
      <canvas id="expense-chart"></canvas>
      <p id="chart-empty-message" class="empty-state">No spending data available.</p>
      <p id="chart-fallback-message" class="hidden">Chart unavailable — failed to load Chart.js.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script defer src="js/app.js"></script>
</body>
</html>
